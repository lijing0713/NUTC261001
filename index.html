<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>城市散步｜大稻埕午後散步</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- 網站標題與導覽列 -->
  <header class="site-header">
    <h1>城市散步</h1>

    <nav>
      <a href="#event">活動資訊</a>
      <a href="#signup">立即報名</a>
    </nav>
  </header>

  <main>
    <!-- 活動主視覺 -->
    <section class="hero">
      <p>TAIPEI WALKING TOUR</p>
      <h2>大稻埕午後散步</h2>
      <p>
        穿過老街與河岸，在三小時內，
        認識城市故事與生活風景。
      </p>
    </section>

    <!-- 活動資訊 -->
    <section id="event" class="event-card with-badge">
      <span class="badge">剩 8 位</span>

      <h2>活動資訊</h2>
      <p>日期：2026 年 10 月 17 日</p>
      <p>時間：14:00–17:00</p>
      <p>集合地點：捷運北門站</p>
      <p>一起走進城市中的小角落，感受街景、故事與日常的美好。</p>
    </section>

    <!-- 集合提醒 -->
    <aside class="notice-card">
      <span class="notice-badge">提醒</span>
      <h2>集合提醒</h2>
      <p>請提前 10 分鐘抵達，並自備飲水。</p>
    </aside>

    <!-- 報名資訊 -->
    <section id="signup" class="signup-card">
      <h2>立即報名</h2>
      <p>活動日期：2026 年 10 月 17 日</p>
      <p>集合地點：捷運北門站</p>
      <a class="signup-button" href="mailto:example@email.com?subject=%E5%A4%A7%E7%A8%BB%E5%9F%95%E5%8D%88%E5%BE%8C%E6%95%A3%E6%AD%A5%E5%A0%B1%E5%90%8D">
        我要報名
      </a>
    </section>
  </main>

  <!-- 頁尾 -->
  <footer class="site-footer">
    <p>&copy; 2026 城市散步｜Taipei Walking Tour</p>
  </footer>
</body>
</html>
